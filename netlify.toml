[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# `npx netlify-cli dev` serves on http://localhost:5173 (matches the Google/Supabase settings).
[dev]
  port = 5173
